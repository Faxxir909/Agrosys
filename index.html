<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroSys - Terminal Inteligente de Corretaje de Granos</title>
    <meta name="description" content="Plataforma profesional de corretaje de granos, logística y emparejamiento inteligente de oferta y demanda en tiempo real." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>" />
    <script>
      // Prevent Uncaught TypeError: Cannot set property fetch of #<Window> which has only a getter
      (function() {
        if (typeof window !== 'undefined' && window.fetch) {
          const originalFetch = window.fetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return originalFetch; },
              set: function(val) { console.warn('Prevented window.fetch overwrite', val); },
              configurable: true
            });
          } catch (e) {
            console.error('Failed to seal window.fetch', e);
          }
        }
        // Cleanup bad localStorage/sessionStorage values that cause JSON.parse("undefined")
        try {
          ['localStorage', 'sessionStorage'].forEach(function(storageName) {
            var storage = window[storageName];
            if (storage) {
              for (var i = storage.length - 1; i >= 0; i--) {
                var key = storage.key(i);
                if (storage.getItem(key) === "undefined") {
                  storage.removeItem(key);
                }
              }
            }
          });
        } catch(e) {}
        
        // Bulletproof global patch to prevent React/Firebase crashing on JSON.parse("undefined")
        const originalJsonParse = JSON.parse;
        JSON.parse = function(text, reviver) {
          if (text === "undefined" || text === undefined) {
            console.warn("Prevented JSON.parse('undefined')");
            return null; 
          }
          return originalJsonParse(text, reviver);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
