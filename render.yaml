databases:
  - name: agrosys-db
    databaseName: agrosys
    user: agrosys_user
    plan: free

services:
  - type: web
    name: agrosys
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agrosys-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_OWNER_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false

